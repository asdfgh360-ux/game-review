<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商鞅变法游戏测评</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body { 
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .option-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid #e0e7ff;
        }
        
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.15);
            border-color: #818cf8;
        }
        
        .option-btn.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            transform: scale(1.02);
        }
        
        .progress-bar {
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }
        
        .input-field {
            transition: all 0.3s ease;
            border: 2px solid #e0e7ff;
        }
        
        .input-field:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.1);
            outline: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .floating {
            animation: floating 3s ease-in-out infinite;
        }
        
        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .result-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
        }
    </style>
<base target="_blank">
</head>
<body class="p-4 md:p-8">

<!-- 开始页 -->
<div id="startPage" class="min-h-screen flex items-center justify-center">
    <div class="glass-card rounded-3xl p-8 md:p-12 max-w-lg w-full text-center fade-in relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
        
        <div class="floating mb-6 text-6xl">🎮</div>
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2 leading-tight">商鞅变法游戏测评</h1>
        <p class="text-gray-500 mb-8">收集反馈，优化体验</p>
        
        <div class="space-y-4">
            <div class="relative">
                <input type="text" id="userName" placeholder="请输入测评人姓名" 
                       class="input-field w-full px-6 py-4 rounded-xl text-lg bg-white text-gray-700 placeholder-gray-400"
                       onkeypress="if(event.key==='Enter') startSurvey()">
                <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </div>
            
            <div class="relative">
                <input type="text" id="gameVersion" placeholder="请输入游戏版本（如：V1.0、测试版A）" 
                       class="input-field w-full px-6 py-4 rounded-xl text-lg bg-white text-gray-700 placeholder-gray-400"
                       onkeypress="if(event.key==='Enter') startSurvey()">
                <div class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                </div>
            </div>
            
            <button onclick="startSurvey()" 
                    class="btn-primary w-full text-white py-4 rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-2 mt-6">
                <span>开始测评</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
            </button>
        </div>
        
        <div class="mt-8 flex justify-center gap-2">
            <div class="w-2 h-2 rounded-full bg-indigo-400"></div>
            <div class="w-2 h-2 rounded-full bg-purple-400"></div>
            <div class="w-2 h-2 rounded-full bg-pink-400"></div>
        </div>
    </div>
</div>

<!-- 问题页 -->
<div id="questionPage" class="hidden min-h-screen flex items-center justify-center py-8">
    <div class="glass-card rounded-3xl p-6 md:p-10 max-w-2xl w-full fade-in relative">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gray-100 rounded-t-3xl overflow-hidden">
            <div id="progressBar" class="progress-bar h-full w-0 rounded-full"></div>
        </div>
        
        <div class="flex justify-between items-center mb-8 mt-2">
            <div class="flex items-center gap-2">
                <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm font-semibold">
                    问题 <span id="currentNum">1</span>/<span id="totalNum">10</span>
                </span>
            </div>
            <div class="flex flex-col items-end gap-1">
                <div class="flex items-center gap-2 text-gray-600 bg-gray-50 px-4 py-2 rounded-full">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span id="userDisplay" class="font-medium"></span>
                </div>
                <div class="flex items-center gap-2 text-gray-500 bg-gray-50 px-3 py-1 rounded-full text-sm">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path></svg>
                    <span id="versionDisplay" class="font-medium"></span>
                </div>
            </div>
        </div>

        <div id="questionContainer" class="mb-8 slide-in">
            <!-- 动态内容 -->
        </div>

        <div class="flex justify-between items-center pt-4 border-t border-gray-100">
            <button onclick="prevQuestion()" id="prevBtn" 
                    class="flex items-center gap-2 px-6 py-3 text-gray-500 hover:text-indigo-600 font-medium transition-colors disabled:opacity-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                上一题
            </button>
            
            <button onclick="nextQuestion()" id="nextBtn" 
                    class="btn-primary px-8 py-3 rounded-xl text-white font-bold shadow-md flex items-center gap-2 disabled:opacity-50">
                <span id="nextBtnText">下一题</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </div>
</div>

<!-- 提交后页面 -->
<div id="submitPage" class="hidden min-h-screen flex items-center justify-center">
    <div class="glass-card rounded-3xl p-8 md:p-12 max-w-md w-full text-center fade-in">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-800 mb-2">测评完成！</h2>
        <div class="space-y-1 mb-6">
            <p class="text-gray-600">感谢 <span id="submitUserName" class="font-bold text-indigo-600"></span> 的宝贵反馈</p>
            <p class="text-gray-500 text-sm">版本：<span id="submitVersion" class="font-medium text-gray-700"></span></p>
        </div>
        
        <div class="space-y-3">
            <button onclick="nextPerson()" 
                    class="w-full bg-white border-2 border-indigo-600 text-indigo-600 py-3 rounded-xl text-lg font-bold hover:bg-indigo-50 transition-colors flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
                下一个人
            </button>
            
            <button onclick="endSurvey()" 
                    class="w-full btn-primary text-white py-3 rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                结束测评
            </button>
        </div>
    </div>
</div>

<!-- 结果统计页 -->
<div id="resultPage" class="hidden min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <div class="glass-card rounded-2xl p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 sticky top-4 z-50 shadow-2xl">
            <div class="flex-1">
                <h2 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                    <span>📊</span> 测评结果统计
                </h2>
                <div class="flex flex-wrap items-center gap-4 mt-2">
                    <p class="text-gray-600">共收集 <span id="totalResponses" class="font-bold text-indigo-600 text-xl">0</span> 份有效反馈</p>
                    <div class="h-4 w-px bg-gray-300"></div>
                    <div id="versionTextDisplay" class="text-gray-700 font-medium"></div>
                </div>
            </div>
            <button onclick="copyResultImage()" 
                    class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all flex items-center gap-2 transform hover:scale-105">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-4 10h6a2 2 0 002-2v-8a2 2 0 00-2-2h-6a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                复制图片
            </button>
        </div>

        <div id="resultCaptureArea" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="result-card p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600 text-sm">1</span>
                        游戏目标清晰度
                    </h3>
                    <div class="chart-container">
                        <canvas id="chart1"></canvas>
                    </div>
                </div>
                
                <div class="result-card p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600 text-sm">3</span>
                        策略思考程度
                    </h3>
                    <div class="chart-container">
                        <canvas id="chart3"></canvas>
                    </div>
                </div>
                
                <div class="result-card p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 bg-pink-100 rounded-lg flex items-center justify-center text-pink-600 text-sm">4</span>
                        理解变法程度
                    </h3>
                    <div class="chart-container">
                        <canvas id="chart4"></canvas>
                    </div>
                </div>
                
                <div class="result-card p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 bg-rose-100 rounded-lg flex items-center justify-center text-rose-600 text-sm">5</span>
                        游戏紧张感
                    </h3>
                    <div class="chart-container">
                        <canvas id="chart5"></canvas>
                    </div>
                </div>
                
                <div class="result-card p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 bg-orange-100 rounded-lg flex items-center justify-center text-orange-600 text-sm">7</span>
                        上手 vs 策略
                    </h3>
                    <div class="chart-container">
                        <canvas id="chart7"></canvas>
                    </div>
                </div>
                
                <div class="result-card p-6">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center text-amber-600 text-sm">8</span>
                        好上手=好玩？
                    </h3>
                    <div class="chart-container">
                        <canvas id="chart8"></canvas>
                    </div>
                </div>
                
                <div class="result-card p-6 md:col-span-2">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <span class="w-8 h-8 bg-teal-100 rounded-lg flex items-center justify-center text-teal-600 text-sm">9</span>
                        决策真实感
                    </h3>
                    <div class="chart-container mx-auto" style="max-width: 400px;">
                        <canvas id="chart9"></canvas>
                    </div>
                </div>
            </div>

            <div class="result-card p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600 text-sm">2</span>
                    最吸引人的地方
                    <span class="text-sm font-normal text-gray-500 ml-2">（按版本标注）</span>
                </h3>
                <div id="q2List" class="grid gap-3"></div>
            </div>

            <div class="result-card p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 bg-gray-100 rounded-lg flex items-center justify-center text-gray-600 text-sm">6</span>
                    无聊的地方
                    <span class="text-sm font-normal text-gray-500 ml-2">（按版本标注）</span>
                </h3>
                <div id="q6List" class="grid gap-3"></div>
            </div>

            <div class="result-card p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <span class="w-8 h-8 bg-indigo-100 rounded-lg flex items-center justify-center text-indigo-600 text-sm">10</span>
                    一句话评价
                    <span class="text-sm font-normal text-gray-500 ml-2">（按版本标注）</span>
                </h3>
                <div id="q10List" class="grid gap-3"></div>
            </div>
            
            <div class="text-center text-gray-400 text-sm py-4">
                商鞅变法游戏测评报告 · 生成时间：<span id="genTime"></span>
            </div>
        </div>
    </div>
</div>

<script>
let allResponses = [];
let currentResponse = {};
let currentQuestion = 0;
let currentUser = "";
let currentVersion = "";
let charts = {};

const questions = [
    {
        id: 1,
        type: 'choice',
        question: '这个游戏的目标清楚吗？',
        options: ['非常清楚', '一般', '不清楚']
    },
    {
        id: 2,
        type: 'text',
        question: '这个版本最吸引你的地方是什么？',
        placeholder: '请详细描述最吸引你的点...'
    },
    {
        id: 3,
        type: 'choice',
        question: '你在做选择时，是真的在思考策略，还是只是随便点？',
        options: ['认真思考策略', '一般', '随便点点']
    },
    {
        id: 4,
        type: 'choice',
        question: '这个版本让你更理解商鞅变法了吗？',
        options: ['理解更深刻', '有一些帮助', '没有帮助']
    },
    {
        id: 5,
        type: 'choice',
        question: '你在玩的时候有没有紧张感？',
        options: ['很紧张刺激', '一般', '完全不紧张']
    },
    {
        id: 6,
        type: 'text',
        question: '这个版本的哪个地方让你觉得无聊？',
        placeholder: '请描述让你觉得无聊的地方（如果没有请写"无"）...'
    },
    {
        id: 7,
        type: 'choice',
        question: '这个版本，偏向于好上手，还是好策略？',
        options: ['好上手', '好策略', '两者平衡']
    },
    {
        id: 8,
        type: 'choice',
        question: '你觉得好上手和好玩是一回事儿吗？',
        options: ['是，一回事', '不是，两回事', '不一定，看情况']
    },
    {
        id: 9,
        type: 'choice',
        question: '这个版本，有没有让你感觉真的在做决策？',
        options: ['有真实决策感', '一般', '没有决策感']
    },
    {
        id: 10,
        type: 'text',
        question: '一句话评价这个版本的商鞅变法游戏',
        placeholder: '请用一句话总结你的评价...'
    }
];

function startSurvey() {
    const name = document.getElementById('userName').value.trim();
    const version = document.getElementById('gameVersion').value.trim();
    
    if (!name) {
        shakeElement(document.getElementById('userName'));
        return;
    }
    if (!version) {
        shakeElement(document.getElementById('gameVersion'));
        return;
    }
    
    currentUser = name;
    currentVersion = version;
    currentResponse = { name: name, version: version, answers: {}, timestamp: new Date() };
    currentQuestion = 0;
    
    document.getElementById('startPage').classList.add('hidden');
    document.getElementById('questionPage').classList.remove('hidden');
    document.getElementById('userDisplay').textContent = name;
    document.getElementById('versionDisplay').textContent = version;
    
    renderQuestion();
}

function renderQuestion() {
    const q = questions[currentQuestion];
    const container = document.getElementById('questionContainer');
    const progress = ((currentQuestion + 1) / questions.length) * 100;
    
    document.getElementById('progressBar').style.width = `${progress}%`;
    document.getElementById('currentNum').textContent = currentQuestion + 1;
    document.getElementById('prevBtn').disabled = currentQuestion === 0;
    document.getElementById('prevBtn').style.opacity = currentQuestion === 0 ? '0' : '1';
    
    container.classList.remove('slide-in');
    void container.offsetWidth;
    container.classList.add('slide-in');
    
    let html = `<h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-8 leading-relaxed">${q.question}</h2>`;
    
    if (q.type === 'choice') {
        html += `<div class="space-y-3">`;
        q.options.forEach((opt) => {
            const selected = currentResponse.answers[q.id] === opt ? 'selected' : '';
            html += `
                <button class="option-btn ${selected} w-full text-left p-4 rounded-xl font-medium text-gray-700 relative overflow-hidden group" 
                        onclick="selectOption('${opt}')">
                    <div class="flex items-center gap-3 relative z-10">
                        <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-colors ${selected ? 'border-white bg-white' : 'border-gray-300 group-hover:border-indigo-400'}">
                            ${selected ? '<div class="w-2.5 h-2.5 rounded-full bg-indigo-600"></div>' : ''}
                        </div>
                        <span class="${selected ? 'text-white' : ''}">${opt}</span>
                    </div>
                </button>
            `;
        });
        html += `</div>`;
    } else {
        const value = currentResponse.answers[q.id] || '';
        html += `
            <textarea id="textAnswer" rows="4" 
                      class="input-field w-full px-6 py-4 rounded-xl text-lg bg-white text-gray-700 resize-none" 
                      placeholder="${q.placeholder}"
                      oninput="updateTextAnswer(this.value)">${value}</textarea>
            <div class="mt-2 text-right text-sm text-gray-400">
                <span id="charCount">${value.length}</span> 字
            </div>
        `;
    }
    
    container.innerHTML = html;
    updateNextButtonState();
}

function selectOption(value) {
    const q = questions[currentQuestion];
    currentResponse.answers[q.id] = value;
    renderQuestion();
    
    setTimeout(() => {
        if (currentQuestion < questions.length - 1) {
            nextQuestion();
        }
    }, 300);
}

function updateTextAnswer(value) {
    const q = questions[currentQuestion];
    currentResponse.answers[q.id] = value.trim();
    document.getElementById('charCount').textContent = value.length;
    updateNextButtonState();
}

function updateNextButtonState() {
    const q = questions[currentQuestion];
    const answer = currentResponse.answers[q.id];
    const hasAnswer = answer && answer.length > 0;
    const btn = document.getElementById('nextBtn');
    const btnText = document.getElementById('nextBtnText');
    
    btn.disabled = !hasAnswer;
    btnText.textContent = currentQuestion === questions.length - 1 ? '提交测评' : '下一题';
    
    if (hasAnswer) {
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
    } else {
        btn.classList.add('opacity-50', 'cursor-not-allowed');
    }
}

function nextQuestion() {
    const q = questions[currentQuestion];
    
    if (q.type === 'text') {
        const textarea = document.getElementById('textAnswer');
        if (textarea) {
            currentResponse.answers[q.id] = textarea.value.trim();
        }
    }
    
    if (!currentResponse.answers[q.id] || currentResponse.answers[q.id].length === 0) {
        shakeElement(document.getElementById('questionContainer'));
        return;
    }
    
    if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        renderQuestion();
    } else {
        submitSurvey();
    }
}

function prevQuestion() {
    if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
    }
}

function submitSurvey() {
    allResponses.push({...currentResponse});
    document.getElementById('questionPage').classList.add('hidden');
    document.getElementById('submitPage').classList.remove('hidden');
    document.getElementById('submitUserName').textContent = currentUser;
    document.getElementById('submitVersion').textContent = currentVersion;
}

function nextPerson() {
    document.getElementById('submitPage').classList.add('hidden');
    document.getElementById('startPage').classList.remove('hidden');
    document.getElementById('userName').value = '';
    document.getElementById('userName').focus();
}

function endSurvey() {
    document.getElementById('submitPage').classList.add('hidden');
    document.getElementById('resultPage').classList.remove('hidden');
    
    document.getElementById('genTime').textContent = new Date().toLocaleString('zh-CN');
    document.getElementById('totalResponses').textContent = allResponses.length;
    
    renderVersionText();
    
    setTimeout(() => {
        renderCharts();
        renderTextAnswers();
    }, 100);
}

function renderVersionText() {
    const versionCount = {};
    allResponses.forEach(r => {
        const v = r.version || '未标注';
        versionCount[v] = (versionCount[v] || 0) + 1;
    });
    
    const versionText = Object.entries(versionCount)
        .map(([ver, count]) => `${ver}(${count}人)`)
        .join('、');
    
    document.getElementById('versionTextDisplay').innerHTML = 
        `<span class="text-gray-500">游戏版本：</span><span class="text-indigo-600 font-semibold">${versionText}</span>`;
}

// 修复后的图表渲染函数
function renderCharts() {
    // 先销毁所有旧图表
    Object.keys(charts).forEach(key => {
        if (charts[key]) {
            charts[key].destroy();
            charts[key] = null;
        }
    });
    charts = {};
    
    const choiceQuestions = [1, 3, 4, 5, 7, 8, 9];
    
    // 3选项饼图配色方案 - 使用对比明显的颜色
    const pieColors = [
        ['#4f46e5', '#818cf8', '#c7d2fe'],  // 深蓝、中蓝、浅蓝
        ['#7c3aed', '#a78bfa', '#ddd6fe'],  // 深紫、中紫、浅紫
        ['#db2777', '#f472b6', '#fbcfe8'],  // 深粉、中粉、浅粉
        ['#e11d48', '#fb7185', '#fecdd3'],  // 深红、中红、浅红
        ['#ea580c', '#fb923c', '#fed7aa'],  // 深橙、中橙、浅橙
        ['#059669', '#34d399', '#a7f3d0'],  // 深绿、中绿、浅绿
        ['#0891b2', '#22d3ee', '#a5f3fc'],  // 深青、中青、浅青
    ];
    
    choiceQuestions.forEach((qId, idx) => {
        const q = questions.find(x => x.id === qId);
        
        // 统计各选项数量
        const counts = {};
        q.options.forEach(opt => counts[opt] = 0);
        
        allResponses.forEach(resp => {
            const ans = resp.answers[qId];
            if (counts[ans] !== undefined) {
                counts[ans]++;
            }
        });
        
        const dataValues = q.options.map(opt => counts[opt]);
        const total = dataValues.reduce((a, b) => a + b, 0);
        
        // 获取canvas上下文
        const ctx = document.getElementById(`chart${qId}`).getContext('2d');
        
        // 如果没有数据，显示空状态
        if (total === 0) {
            charts[qId] = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['暂无数据'],
                    datasets: [{
                        data: [1],
                        backgroundColor: ['#e5e7eb'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '60%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    }
                }
            });
            return;
        }
        
        // 创建图表
        charts[qId] = new Chart(ctx, {
            type: 'pie',  // 使用标准饼图，更清晰
            data: {
                labels: q.options,
                datasets: [{
                    data: dataValues,
                    backgroundColor: pieColors[idx % pieColors.length],
                    borderWidth: 2,
                    borderColor: '#ffffff',
                    hoverOffset: 10
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: {
                    padding: 10
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 15,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            font: { 
                                size: 12,
                                family: "'Noto Sans SC', sans-serif"
                            },
                            generateLabels: function(chart) {
                                const data = chart.data;
                                return data.labels.map((label, i) => ({
                                    text: `${label}: ${data.datasets[0].data[i]}人`,
                                    fillStyle: data.datasets[0].backgroundColor[i],
                                    strokeStyle: data.datasets[0].backgroundColor[i],
                                    lineWidth: 0,
                                    index: i,
                                    hidden: false
                                }));
                            }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        cornerRadius: 8,
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.parsed || 0;
                                const percentage = ((value / total) * 100).toFixed(1);
                                return `${label}: ${value}人 (${percentage}%)`;
                            }
                        }
                    }
                },
                animation: {
                    animateRotate: true,
                    duration: 1000
                }
            }
        });
    });
}

function renderTextAnswers() {
    const renderList = (qId, containerId) => {
        const container = document.getElementById(containerId);
        const answers = allResponses.map(r => ({
            name: r.name,
            version: r.version || '未标注',
            text: r.answers[qId]
        })).filter(x => x.text && x.text !== '无' && x.text.length > 0);
        
        if (answers.length === 0) {
            container.innerHTML = '<div class="text-gray-400 italic p-4 bg-gray-50 rounded-lg">暂无回答</div>';
            return;
        }
        
        container.innerHTML = answers.map((a, i) => `
            <div class="bg-gradient-to-r from-indigo-50 to-purple-50 p-4 rounded-xl border-l-4 border-indigo-400 hover:shadow-md transition-shadow" style="animation: fadeIn 0.5s ease-out ${i * 0.1}s both">
                <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2">
                        <span class="bg-white px-2 py-1 rounded-md text-xs font-bold text-indigo-600 shadow-sm">${a.name}</span>
                        <span class="text-xs text-gray-500 bg-gray-200 px-2 py-1 rounded-full">${a.version}</span>
                    </div>
                </div>
                <div class="text-gray-700 leading-relaxed">${a.text}</div>
            </div>
        `).join('');
    };
    
    renderList(2, 'q2List');
    renderList(6, 'q6List');
    renderList(10, 'q10List');
}

async function copyResultImage() {
    const element = document.getElementById('resultCaptureArea');
    const btn = event.currentTarget;
    const originalHTML = btn.innerHTML;
    
    try {
        btn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>生成中...</span>';
        btn.disabled = true;
        
        element.scrollIntoView({ behavior: 'instant', block: 'start' });
        
        const canvas = await html2canvas(element, {
            scale: 2,
            backgroundColor: '#f8fafc',
            useCORS: true,
            logging: false,
            windowWidth: element.scrollWidth,
            windowHeight: element.scrollHeight
        });
        
        canvas.toBlob(async (blob) => {
            try {
                await navigator.clipboard.write([
                    new ClipboardItem({ 'image/png': blob })
                ]);
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>已复制！</span>';
                btn.classList.remove('from-pink-500', 'to-rose-500');
                btn.classList.add('from-green-500', 'to-emerald-500');
                
                setTimeout(() => {
                    btn.innerHTML = originalHTML;
                    btn.classList.add('from-pink-500', 'to-rose-500');
                    btn.classList.remove('from-green-500', 'to-emerald-500');
                    btn.disabled = false;
                }, 2000);
            } catch (err) {
                alert('复制失败，请尝试截图');
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            }
        });
    } catch (err) {
        alert('生成图片失败，请重试');
        btn.innerHTML = originalHTML;
        btn.disabled = false;
    }
}

function shakeElement(element) {
    element.style.animation = 'shake 0.5s';
    setTimeout(() => {
        element.style.animation = '';
    }, 500);
}

const style = document.createElement('style');
style.textContent = `
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }
`;
document.head.appendChild(style);

document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter' && (e.target.id === 'userName' || e.target.id === 'gameVersion')) {
        startSurvey();
    }
});
</script>
